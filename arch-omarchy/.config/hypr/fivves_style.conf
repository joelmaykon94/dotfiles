# ==============================================================================
# Hyprland Custom Aesthetic Overrides (Fivves Style)
# ==============================================================================

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
}

decoration {
    rounding = 12
    active_opacity = 0.98
    inactive_opacity = 0.90

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(00000044)
    }

    blur {
        enabled = true
        size = 5
        passes = 3
        new_optimizations = true
        xray = false
    }
}

animations {
    enabled = true

    bezier = ease, 0.05, 0.9, 0.1, 1.0
    bezier = easeOutQuint, 0.23, 1, 0.32, 1

    animation = windows, 1, 5, easeOutQuint
    animation = windowsOut, 1, 4, easeOutQuint
    animation = border, 1, 6, ease
    animation = borderangle, 1, 6, ease
    animation = fade, 1, 4, ease
    animation = workspaces, 1, 4, easeOutQuint, slide
}

dwindle {
    preserve_split = true
    force_split = 0
}
