# ==============================================================================
# Hyprland Glassmorphism Aesthetic Preset (Hyprland 0.53+ Syntax)
# ==============================================================================

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(bb86fcee) 45deg
    col.inactive_border = rgba(59595933)
    resize_on_border = true
}

decoration {
    rounding = 12

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000055)
    }

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = false
        noise = 0.02
        contrast = 0.95
        brightness = 0.85
        vibrancy = 0.25
        vibrancy_darkness = 0.20
    }
}

animations {
    enabled = true

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = fluent, 0, 0.55, 0.45, 1

    animation = windows, 1, 4, easeOutQuint, popin 85%
    animation = windowsOut, 1, 3, fluent, popin 85%
    animation = border, 1, 6, easeOutQuint
    animation = borderangle, 1, 12, easeOutQuint, loop
    animation = fade, 1, 3, fluent
    animation = workspaces, 1, 4, easeOutQuint, slide
}

# --- Transparência Glassmorphism Inteligente ---
# Terminais com efeito de vidro fosco (88% ativo / 78% inativo)
windowrule = opacity 0.88 0.78, match:class ^(ghostty|com.mitchellh.ghostty|Alacritty|kitty)$

# Blur aplicado em menus, barra e notificações (Sintaxe Hyprland 0.53+)
layerrule = blur on, match:namespace waybar
layerrule = blur on, match:namespace walker
layerrule = blur on, match:namespace swayosd
layerrule = blur on, match:namespace notifications
layerrule = ignore_alpha 0.5, match:namespace waybar
layerrule = ignore_alpha 0.5, match:namespace walker
layerrule = ignore_alpha 0.5, match:namespace swayosd
layerrule = ignore_alpha 0.5, match:namespace notifications

dwindle {
    preserve_split = true
    force_split = 0
}
